<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karty porównawcze sacharydów</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0a0f;
  --bg-card: #14141f;
  --bg-input: #1c1c2a;
  --border-color: #2a2a3a;
  --text-primary: #e8e8ed;
  --text-secondary: #8888a0;
  --accent: #00d4ff;
  --accent-hover: #00b8e6;
  --accent-glow: rgba(0, 212, 255, 0.15);
  --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  letter-spacing: 0.01em;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  padding: 48px 24px;
}

body.light {
  --bg-primary: #f4f4f4;
  --bg-card: #ffffff;
  --bg-input: #e8e8ed;
  --border-color: #e0e0e0;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6b6b;
  --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
}

.top-bar {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: flex-end;
  justify-content: flex-end;
  gap: 8px;
  max-width: 800px;
  margin: 0 auto 32px;
}

.toggle-btn {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
  font-family: inherit;
}

.toggle-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

header {
  text-align: center;
  margin-bottom: 48px;
}

header h1 {
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  color: var(--text-primary);
  transition: color 0.3s;
}

header p {
  font-size: 15px;
  color: var(--text-secondary);
  transition: color 0.3s;
}

.grid {
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 24px;
  max-width: 800px;
  margin: 0 auto;
  -webkit-justify-content: center;
  justify-content: center;
}

.card-container {
  width: calc(50% - 12px);
  min-width: 280px;
  aspect-ratio: 1 / 1.1;
  perspective: 900px;
  cursor: pointer;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

.card-container.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  box-shadow: var(--card-shadow);
  padding: 24px;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  overflow: hidden;
}

.card-front {
  background: var(--bg-card);
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
}

.card-front:hover {
  box-shadow: var(--card-shadow), 0 0 24px var(--accent-glow);
}

.card-back {
  background: var(--bg-card);
  transform: rotateY(180deg);
  gap: 16px;
  -webkit-justify-content: center;
  justify-content: center;
}

.card-emoji {
  font-size: 48px;
  line-height: 1;
}

.card-name {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--accent);
}

.card-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.card-formula {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-input);
  padding: 6px 16px;
  border-radius: 20px;
  letter-spacing: 0.03em;
  transition: background 0.3s, color 0.3s;
}

.card-type {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
}

.back-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
}

.back-text {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.6;
  transition: color 0.3s;
}

.back-text strong {
  color: var(--accent);
  font-weight: 600;
}

.hint {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 8px;
  transition: color 0.3s;
}

.flip-hint {
  position: absolute;
  bottom: 12px;
  right: 16px;
  font-size: 11px;
  color: var(--text-secondary);
  opacity: 0.6;
  transition: color 0.3s;
}

@media (max-width: 620px) {
  body { padding: 32px 16px; }
  .card-container { width: 100%; aspect-ratio: auto; min-height: 320px; }
  header h1 { font-size: 24px; }
  .card-emoji { font-size: 40px; }
  .card-name { font-size: 20px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <button class="toggle-btn" id="themeToggle">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    Motyw
  </button>
</div>

<header>
  <h1>Karty porównawcze sacharydów</h1>
  <p>Kliknij kartę, aby odkryć szczegóły</p>
</header>

<div class="grid" id="grid"></div>

<script>
var cards = [
  {
    name: "GLUKOZA",
    subtitle: "cukier gronowy",
    emoji: "🍇",
    formula: "C₆H₁₂O₆",
    type: "cukier prosty (monosacharyd)",
    back: "Występuje w <strong>owocach, miodzie i krwi</strong>. Podstawowe paliwo dla mózgu i mięśni — błyskawicznie wchłaniana do krwiobiegu.<br><br>Pozostałe monosacharydy wg liczby atomów węgla: trioza C₃H₆O₃, tetroza C₄H₈O₄, pentoza C₅H₁₀O₅."
  },
  {
    name: "FRUKTOZA",
    subtitle: "cukier owocowy",
    emoji: "🍓🍎",
    formula: "C₆H₁₂O₆",
    type: "cukier prosty (monosacharyd)",
    back: "Ten sam wzór sumaryczny co glukoza, ale <strong>inne ułożenie atomów</strong> (izomery) — dzięki temu fruktoza jest <strong>znacznie słodsza</strong>.<br><br>Występuje naturalnie w owocach i miodzie."
  },
  {
    name: "SACHAROZA",
    subtitle: "cukier spożywczy",
    emoji: "🍬",
    formula: "C₁₂H₂₂O₁₁",
    type: "disacharyd (glukoza + fruktoza)",
    back: "Tradycyjny cukier z torebki. Pozyskiwana z <strong>buraków cukrowych</strong> lub <strong>trzciny cukrowej</strong>.<br><br>Dwie reszty monosacharydowe połączone <strong>wiązaniem O-glikozydowym</strong> (przez atom tlenu).<br><br>Zastosowania: słodycze, karmel, a także… pianki poliuretanowe do izolacji budynków!"
  },
  {
    name: "LAKTOZA",
    subtitle: "cukier mleczny",
    emoji: "🥛🐄",
    formula: "C₁₂H₂₂O₁₁",
    type: "disacharyd (glukoza + galaktoza)",
    back: "Występuje w <strong>mleku ssaków</strong>. Do jej strawienia potrzebny jest enzym <strong>laktaza</strong> — jego brak powoduje nietolerancję laktozy.<br><br>Zastosowania: żywność dla niemowląt, a także składnik <strong>mieszanek dymotwórczych</strong> i świec dymnych."
  }
];

function renderCards() {
  var grid = document.getElementById("grid");
  var html = "";
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    html += '<div class="card-container" onclick="this.classList.toggle(\'flipped\')">' +
      '<div class="card-inner">' +
        '<div class="card-front">' +
          '<div class="card-emoji">' + c.emoji + '</div>' +
          '<div class="card-name">' + c.name + '</div>' +
          '<div class="card-subtitle">' + c.subtitle + '</div>' +
          '<div class="card-formula">' + c.formula + '</div>' +
          '<div class="card-type">' + c.type + '</div>' +
          '<span class="flip-hint">kliknij →</span>' +
        '</div>' +
        '<div class="card-back">' +
          '<div class="back-title">' + c.emoji + ' ' + c.name + '</div>' +
          '<div class="back-text">' + c.back + '</div>' +
          '<span class="flip-hint">← wróć</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  grid.innerHTML = html;
}

document.getElementById("themeToggle").addEventListener("click", function() {
  document.body.classList.toggle("light");
});

renderCards();
</script>
</body>
</html>
