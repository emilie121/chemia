<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karty porównawcze sacharydów</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0a0f;
  --bg-card: #14141f;
  --bg-input: #1c1c2a;
  --border-color: #2a2a3a;
  --text-primary: #e8e8ed;
  --text-secondary: #8888a0;
  --accent: #00d4ff;
  --accent-hover: #00b8e6;
  --accent-glow: rgba(0, 212, 255, 0.15);
  --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  letter-spacing: 0.01em;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  padding: 48px 24px;
}

body.light {
  --bg-primary: #f4f4f4;
  --bg-card: #ffffff;
  --bg-input: #e8e8ed;
  --border-color: #e0e0e0;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6b6b;
  --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
}

.top-bar {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: flex-end;
  justify-content: flex-end;
  gap: 8px;
  max-width: 1200px;
  margin: 0 auto 32px;
}

.toggle-btn {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
  font-family: inherit;
}

.toggle-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

header {
  text-align: center;
  margin-bottom: 48px;
}

header h1 {
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  color: var(--text-primary);
  transition: color 0.3s;
}

header p {
  font-size: 15px;
  color: var(--text-secondary);
  transition: color 0.3s;
}

.grid {
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
  -webkit-justify-content: center;
  justify-content: center;
}

.card-container {
  width: calc(33.333% - 16px);
  min-height: 340px;
  perspective: 900px;
  cursor: pointer;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

.card-container.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  box-shadow: var(--card-shadow);
  padding: 24px;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.card-front {
  background: var(--bg-card);
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
}

.card-front:hover {
  box-shadow: var(--card-shadow), 0 0 24px var(--accent-glow);
}

.card-back {
  background: var(--bg-card);
  transform: rotateY(180deg);
  gap: 16px;
  -webkit-justify-content: center;
  justify-content: center;
}

.card-emoji {
  font-size: 48px;
  line-height: 1;
}

.card-name {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--accent);
}

.card-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.card-formula {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-input);
  padding: 6px 16px;
  border-radius: 20px;
  letter-spacing: 0.03em;
  transition: background 0.3s, color 0.3s;
}

.card-type {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
}

.back-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
}

.back-text {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.6;
  transition: color 0.3s;
}

.back-text strong {
  color: var(--accent);
  font-weight: 600;
}

.mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 8px 0;
}

.mini-table th {
  text-align: left;
  color: var(--accent);
  font-weight: 600;
  padding: 4px 8px;
  border-bottom: 1px solid var(--border-color);
}

.mini-table td {
  padding: 4px 8px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
}

.mini-table tr:last-child td {
  border-bottom: none;
}

.big-formula {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  text-align: center;
  padding: 12px 0;
  letter-spacing: 0.02em;
}

.hint {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 8px;
  transition: color 0.3s;
}

.flip-hint {
  position: absolute;
  bottom: 12px;
  right: 16px;
  font-size: 11px;
  color: var(--text-secondary);
  opacity: 0.6;
  transition: color 0.3s;
}

@media (max-width: 960px) {
  .card-container { width: calc(50% - 12px); }
}

@media (max-width: 620px) {
  body { padding: 32px 16px; }
  .card-container { width: 100%; min-height: 320px; }
  header h1 { font-size: 24px; }
  .card-emoji { font-size: 40px; }
  .card-name { font-size: 20px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <button class="toggle-btn" id="themeToggle">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    Motyw
  </button>
</div>

<header>
  <h1>Karty porównawcze sacharydów</h1>
  <p>Kliknij kartę, aby odkryć szczegóły</p>
</header>

<div class="grid" id="grid"></div>

<script>
var cards = [
  {
    name: "GLUKOZA",
    subtitle: "cukier gronowy",
    emoji: "🍇",
    formula: "C₆H₁₂O₆",
    type: "cukier prosty (monosacharyd)",
    back: "Występuje w <strong>owocach, miodzie i krwi</strong>. Podstawowe paliwo dla mózgu i mięśni — błyskawicznie wchłaniana do krwiobiegu.<br><br>Pozostałe monosacharydy wg liczby atomów węgla: trioza C₃H₆O₃, tetroza C₄H₈O₄, pentoza C₅H₁₀O₅."
  },
  {
    name: "FRUKTOZA",
    subtitle: "cukier owocowy",
    emoji: "🍓🍎",
    formula: "C₆H₁₂O₆",
    type: "cukier prosty (monosacharyd)",
    back: "Ten sam wzór sumaryczny co glukoza, ale <strong>inne ułożenie atomów</strong> (izomery) — dzięki temu fruktoza jest <strong>znacznie słodsza</strong>.<br><br>Występuje naturalnie w owocach i miodzie."
  },
  {
    name: "SACHAROZA",
    subtitle: "cukier spożywczy",
    emoji: "🍬",
    formula: "C₁₂H₂₂O₁₁",
    type: "disacharyd (glukoza + fruktoza)",
    back: "Tradycyjny cukier z torebki. Pozyskiwana z <strong>buraków cukrowych</strong> lub <strong>trzciny cukrowej</strong>.<br><br>Dwie reszty monosacharydowe połączone <strong>wiązaniem O-glikozydowym</strong> (przez atom tlenu).<br><br>Zastosowania: słodycze, karmel, a także… pianki poliuretanowe do izolacji budynków!"
  },
  {
    name: "LAKTOZA",
    subtitle: "cukier mleczny",
    emoji: "🥛🐄",
    formula: "C₁₂H₂₂O₁₁",
    type: "disacharyd (glukoza + galaktoza)",
    back: "Występuje w <strong>mleku ssaków</strong>. Do jej strawienia potrzebny jest enzym <strong>laktaza</strong> — jego brak powoduje nietolerancję laktozy.<br><br>Zastosowania: żywność dla niemowląt, a także składnik <strong>mieszanek dymotwórczych</strong> i świec dymnych."
  },
  {
    name: "GALAKTOZA",
    subtitle: "",
    emoji: "🧪",
    formula: "C₆H₁₂O₆",
    type: "cukier prosty (monosacharyd)",
    back: "Składnik <strong>laktozy</strong> (cukru mlecznego). Razem z glukozą tworzy laktozę.<br><br>Ważna rola w budowie <strong>glikolipidów</strong> i <strong>glikoprotein</strong> — cząsteczek niezbędnych do prawidłowego funkcjonowania komórek."
  },
  {
    name: "Rodzina monosacharydów",
    subtitle: "INNE MONOSACHARYDY",
    emoji: "🔬",
    formula: "",
    type: "cukry proste o 3–8 atomach węgla",
    back: '<table class="mini-table"><tr><th>Nazwa</th><th>Wzór</th><th>Atomy C</th></tr><tr><td>Trioza</td><td>C₃H₆O₃</td><td>3</td></tr><tr><td>Tetroza</td><td>C₄H₈O₄</td><td>4</td></tr><tr><td>Pentoza</td><td>C₅H₁₀O₅</td><td>5</td></tr></table>Monosacharydy to <strong>białe substancje krystaliczne</strong>, rozpuszczalne w wodzie, o słodkim smaku.<br><br>Stosowane w przemyśle <strong>włókienniczym, szklarskim</strong> i <strong>spożywczym</strong>.'
  },
  {
    name: "SKROBIA",
    subtitle: "",
    emoji: "🥔",
    formula: "",
    type: "polisacharyd (zapasowy u roślin)",
    back: "Forma <strong>magazynowania energii u roślin</strong>. Zbudowana z wielu cząsteczek glukozy.<br><br>Występuje w <strong>ziemniakach, ryżu, zbożach</strong>.<br><br>Organizm rozkłada ją do glukozy podczas trawienia."
  },
  {
    name: "GLIKOGEN",
    subtitle: "",
    emoji: "💪",
    formula: "",
    type: "polisacharyd (zapasowy u zwierząt)",
    back: "Forma <strong>magazynowania energii u zwierząt i ludzi</strong>. Zbudowany z wielu cząsteczek glukozy.<br><br>Magazynowany głównie w <strong>wątrobie i mięśniach</strong>.<br><br>Gdy organizm potrzebuje energii, rozkłada glikogen z powrotem do glukozy."
  },
  {
    name: "CELULOZA",
    subtitle: "",
    emoji: "🌿",
    formula: "",
    type: "polisacharyd (budulcowy)",
    back: "Buduje <strong>ściany komórkowe roślin</strong>, nadaje im sztywność.<br><br>Zbudowana z glukozy, ale połączonej inaczej niż w skrobi — dlatego <strong>ludzie nie potrafią jej strawić</strong>.<br><br>Najczęściej występujący związek organiczny na Ziemi."
  },
  {
    name: "Wiązanie O-glikozydowe",
    subtitle: "",
    emoji: "⚡",
    formula: "",
    type: "mechanizm łączenia cukrów",
    back: '<svg viewBox="0 0 320 130" width="100%" style="max-width:320px;margin:0 auto;display:block"><polygon points="40,35 65,20 90,35 90,60 65,75 40,60" fill="none" stroke="#00d4ff" stroke-width="2"/><polygon points="230,35 255,20 280,35 280,60 255,75 230,60" fill="none" stroke="#00d4ff" stroke-width="2"/><circle cx="160" cy="48" r="16" fill="none" stroke="#ff3d57" stroke-width="2"/><text x="160" y="53" text-anchor="middle" fill="#ff3d57" font-size="15" font-weight="700" font-family="sans-serif">O</text><line x1="90" y1="48" x2="144" y2="48" stroke="#8888a0" stroke-width="2"/><line x1="176" y1="48" x2="230" y2="48" stroke="#8888a0" stroke-width="2"/><text x="65" y="100" text-anchor="middle" fill="#8888a0" font-size="11" font-family="sans-serif">monosacharyd 1</text><text x="255" y="100" text-anchor="middle" fill="#8888a0" font-size="11" font-family="sans-serif">monosacharyd 2</text><text x="160" y="122" text-anchor="middle" fill="#ff3d57" font-size="11" font-family="sans-serif">atom tlenu (O)</text></svg><div style="margin-top:12px">Litera <strong>O</strong> w nazwie oznacza, że dwie reszty monosacharydowe są połączone za pomocą <strong>atomu tlenu</strong>. Tak powstają disacharydy.</div>'
  },
  {
    name: "Wzór ogólny sacharydów",
    subtitle: "",
    emoji: "📐",
    formula: "",
    type: "Cₙ(H₂O)ₘ",
    back: '<div class="big-formula">Cₙ(H₂O)ₘ</div>Sacharydy = grupa związków organicznych z atomów <strong>węgla (C)</strong>, <strong>wodoru (H)</strong> i <strong>tlenu (O)</strong>.<br><br>Wzór Cₙ(H₂O)ₘ wygląda jakby węgiel był „uwodniony" — stąd stara nazwa <strong>„węglowodany"</strong>.<br><br>Zawierają grupy:<br>• hydroksylową <strong>–OH</strong><br>• aldehydową <strong>–CHO</strong><br>• karbonylową <strong>C=O</strong>'
  }
];

function renderCards() {
  var grid = document.getElementById("grid");
  var html = "";
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    var formulaHtml = c.formula ? '<div class="card-formula">' + c.formula + '</div>' : '';
    var subtitleHtml = c.subtitle ? '<div class="card-subtitle">' + c.subtitle + '</div>' : '';
    html += '<div class="card-container" onclick="this.classList.toggle(\'flipped\')">' +
      '<div class="card-inner">' +
        '<div class="card-front">' +
          '<div class="card-emoji">' + c.emoji + '</div>' +
          '<div class="card-name">' + c.name + '</div>' +
          subtitleHtml +
          formulaHtml +
          '<div class="card-type">' + c.type + '</div>' +
          '<span class="flip-hint">kliknij →</span>' +
        '</div>' +
        '<div class="card-back">' +
          '<div class="back-title">' + c.emoji + ' ' + c.name + '</div>' +
          '<div class="back-text">' + c.back + '</div>' +
          '<span class="flip-hint">← wróć</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  grid.innerHTML = html;
}

document.getElementById("themeToggle").addEventListener("click", function() {
  document.body.classList.toggle("light");
});

renderCards();

function adjustCardHeights() {
  var containers = document.querySelectorAll(".card-container");
  for (var i = 0; i < containers.length; i++) {
    var front = containers[i].querySelector(".card-front");
    var back = containers[i].querySelector(".card-back");
    front.style.position = "relative";
    back.style.position = "relative";
    back.style.transform = "none";
    var frontH = front.scrollHeight;
    var backH = back.scrollHeight;
    var maxH = Math.max(frontH, backH) + 2;
    front.style.position = "";
    back.style.position = "";
    back.style.transform = "";
    containers[i].style.height = maxH + "px";
  }
}
adjustCardHeights();
window.addEventListener("resize", adjustCardHeights);
</script>
</body>
</html>
